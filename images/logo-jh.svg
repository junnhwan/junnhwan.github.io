<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-label="mark">
  <!--
    Personal mark · Ink twin-loop
    Continuous solid linked rings, calligraphic wall thickness.
    No monogram, no tail, no letter cues — pure bond form.
  -->
  <defs>
    <linearGradient id="ink" x1="8%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="40%" stop-color="#e6e2d8"/>
      <stop offset="100%" stop-color="#b0ab9f"/>
    </linearGradient>
    <radialGradient id="wash" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="press" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.28"/>
    </filter>
  </defs>

  <g filter="url(#press)">
    <path
      fill="url(#ink)"
      fill-rule="evenodd"
      d="
        M 50 8
        C 28 6, 8 22, 8 42
        C 8 64, 26 82, 50 82
        C 60 82, 68 76, 74 68
        C 78 76, 88 84, 102 84
        C 128 84, 150 64, 150 42
        C 150 18, 128 6, 104 8
        C 92 10, 84 18, 80 28
        C 74 16, 62 8, 50 8
        Z

        M 50 30
        C 62 28, 68 36, 68 44
        C 68 56, 58 66, 46 64
        C 34 62, 28 52, 30 42
        C 32 32, 40 30, 50 30
        Z

        M 106 28
        C 118 26, 128 34, 128 44
        C 128 58, 116 68, 102 66
        C 90 64, 84 54, 86 44
        C 88 34, 96 28, 106 28
        Z
      "/>
    <path
      fill="url(#wash)"
      fill-rule="evenodd"
      d="
        M 50 8
        C 28 6, 8 22, 8 42
        C 8 64, 26 82, 50 82
        C 60 82, 68 76, 74 68
        C 78 76, 88 84, 102 84
        C 128 84, 150 64, 150 42
        C 150 18, 128 6, 104 8
        C 92 10, 84 18, 80 28
        C 74 16, 62 8, 50 8
        Z
        M 50 30
        C 62 28, 68 36, 68 44
        C 68 56, 58 66, 46 64
        C 34 62, 28 52, 30 42
        C 32 32, 40 30, 50 30
        Z
        M 106 28
        C 118 26, 128 34, 128 44
        C 128 58, 116 68, 102 66
        C 90 64, 84 54, 86 44
        C 88 34, 96 28, 106 28
        Z
      "/>
  </g>
</svg>
